[build]
  # Override an accidentally selected app directory in Netlify's monorepo UI.
  # Dependencies and the filtered web build must run from the workspace root.
  base = "."
  command = "pnpm --filter @rackstage/web build"
  publish = "apps/web/.next"

[build.environment]
  # Node 22.13.1 bundles an obsolete Corepack signing-key set that cannot
  # verify current pnpm releases. Node 24 also matches the verified local build.
  NODE_VERSION = "24.18.0"
  PNPM_FLAGS = "--shamefully-hoist"

# Netlify's automatic framework detection can miss Next.js in this pnpm
# monorepo. Declare the adapter explicitly so SSR routes and API handlers are
# converted into Netlify functions instead of publishing the raw .next files.
[[plugins]]
  package = "@netlify/plugin-nextjs"
